<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CAStudio</title>
    <script>
      try {
        const theme = localStorage.getItem('castudio-theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-[#0A0A0C] text-[#EDEDED] overflow-hidden select-none">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
