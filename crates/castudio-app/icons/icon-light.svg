<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="#F8FAFC" stroke="rgba(0, 0, 0, 0.08)" stroke-width="4"/>
  <!-- Radial glow halus -->
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>
  <!-- Faceted Crystal Prism -->
  <g fill="none">
    <polygon points="256,92 396,256 256,420 116,256"
             stroke="url(#symbolGrad)" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="256" y1="92" x2="256" y2="420" stroke="#8B5CF6" stroke-width="28" stroke-linecap="round"/>
    <line x1="116" y1="256" x2="396" y2="256" stroke="#7C3AED" stroke-width="28" stroke-linecap="round"/>
  </g>
</svg>
