      <line x1="116" y1="256" x2="396" y2="256" stroke="#A855F7" stroke-width="28" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Typography -->
  <text x="256" y="390" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">CAStudio</text>
  <text x="256" y="425" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="0.2">AI Content &amp; Script Engine</text>
